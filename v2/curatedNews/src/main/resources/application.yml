spring:
  application:
    name: curatedNews
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/curatednews
    username: postgres
    password: local2025
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: curated
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    schemas: curated
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
